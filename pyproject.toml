[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexanna-iivx"
version = "0.1.0"
description = "A deterministic, metadata-driven agent harness for out-of-core local data engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "gtkrshnaaa" }
]
keywords = [
    "data-engineering",
    "out-of-core",
    "duckdb",
    "llm-agent",
    "deterministic",
    "metadata-first"
]
dependencies = [
    "duckdb>=1.0.0",
    "pydantic>=2.5.0",
    "openai>=1.10.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
benchmarks = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "matplotlib>=3.8.0"
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]
all = [
    "hexanna-iivx[benchmarks,test]"
]

[project.scripts]
hexanna = "hexanna.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
