services:
  hexanna:
    build: .
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_API_KEY=${LLM_API_KEY:-EMPTY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
